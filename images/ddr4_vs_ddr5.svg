<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .hdr { font: 700 20px Arial, sans-serif; fill: #111827; }
      .txt { font: 500 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .box { stroke-width: 2; rx: 12; }
      .ok { fill: #dcfce7; stroke: #16a34a; }
      .mid { fill: #dbeafe; stroke: #2563eb; }
      .warn { fill: #fef3c7; stroke: #d97706; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="30" y="45" class="title">DDR4 vs DDR5 (Quick Revision)</text>

  <rect x="40" y="80" width="500" height="500" class="box mid"/>
  <rect x="560" y="80" width="500" height="500" class="box ok"/>

  <text x="250" y="118" text-anchor="middle" class="hdr">DDR4</text>
  <text x="810" y="118" text-anchor="middle" class="hdr">DDR5</text>

  <line x1="40" y1="150" x2="1060" y2="150" class="grid"/>
  <line x1="40" y1="215" x2="1060" y2="215" class="grid"/>
  <line x1="40" y1="280" x2="1060" y2="280" class="grid"/>
  <line x1="40" y1="345" x2="1060" y2="345" class="grid"/>
  <line x1="40" y1="410" x2="1060" y2="410" class="grid"/>
  <line x1="40" y1="475" x2="1060" y2="475" class="grid"/>

  <text x="60" y="186" class="txt">Typical base data rate: 2133-3200 MT/s</text>
  <text x="580" y="186" class="txt">Typical base data rate: 4800+ MT/s</text>

  <text x="60" y="251" class="txt">DIMM channels: 1 x 64-bit</text>
  <text x="580" y="251" class="txt">DIMM channels: 2 x 32-bit subchannels</text>

  <text x="60" y="316" class="txt">On-die ECC: not standard for consumer DDR4</text>
  <text x="580" y="316" class="txt">On-die ECC: present (internal reliability)</text>

  <text x="60" y="381" class="txt">PMIC location: on motherboard</text>
  <text x="580" y="381" class="txt">PMIC location: on DIMM module</text>

  <text x="60" y="446" class="txt">Voltage (nominal): ~1.2V</text>
  <text x="580" y="446" class="txt">Voltage (nominal): ~1.1V</text>

  <text x="60" y="511" class="txt">Best for: value and mature platforms</text>
  <text x="580" y="511" class="txt">Best for: bandwidth and newer platforms</text>

  <rect x="40" y="535" width="1020" height="45" class="box warn"/>
  <text x="55" y="563" class="small">Note: Real performance depends on both bandwidth (MT/s) and latency timings (CL, tRCD, tRP), plus CPU and workload behavior.</text>
</svg>
