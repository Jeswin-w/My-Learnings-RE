<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 18px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #374151; stroke-width: 3; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="30" y="44" class="title">Memory Hierarchy</text>
  <text x="30" y="70" class="small">Top: fastest, smallest, highest cost/bit</text>
  <text x="30" y="92" class="small">Bottom: slowest, largest, lowest cost/bit</text>

  <rect x="300" y="120" width="360" height="64" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="430" y="160" class="label">CPU Registers</text>

  <rect x="260" y="205" width="440" height="70" rx="12" fill="#ffedd5" stroke="#f97316"/>
  <text x="405" y="247" class="label">L1/L2/L3 Cache (SRAM)</text>

  <rect x="220" y="300" width="520" height="78" rx="12" fill="#fef9c3" stroke="#eab308"/>
  <text x="385" y="346" class="label">Main Memory (DRAM)</text>

  <rect x="180" y="410" width="600" height="88" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="390" y="462" class="label">Storage (SSD / HDD)</text>

  <line x1="480" y1="184" x2="480" y2="205" class="arrow"/>
  <line x1="480" y1="275" x2="480" y2="300" class="arrow"/>
  <line x1="480" y1="378" x2="480" y2="410" class="arrow"/>

  <text x="720" y="154" class="small">Latency: very low</text>
  <text x="720" y="235" class="small">Capacity: small</text>
  <text x="720" y="336" class="small">Cost/bit: high</text>

  <text x="720" y="446" class="small">Latency: high</text>
  <text x="720" y="468" class="small">Capacity: large</text>
  <text x="720" y="490" class="small">Cost/bit: low</text>
</svg>
